    <g stroke="#0f0620" stroke-width="9">
      <line x1="370" y1="260" x2="830" y2="260"/>
      <line x1="370" y1="295" x2="830" y2="295"/>
      <line x1="370" y1="330" x2="830" y2="330"/>
      <line x1="370" y1="365" x2="830" y2="365"/>
      <line x1="370" y1="400" x2="830" y2="400"/>
    </g>
  </g>
  <g stroke="#05dfd7" stroke-width="1" opacity="0.3">
    <line x1="0" y1="460" x2="1200" y2="460"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="580" x2="1200" y2="580"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="150" y1="440" x2="0" y2="630"/>
    <line x1="450" y1="440" x2="380" y2="630"/>
