  <text x="600" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="52" fill="#fdf4ff">BEFORE 40</text>
  <text x="600" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="26" fill="#05dfd7" letter-spacing="2">ASHTON'S YEAR OF LIVE MUSIC</text>
