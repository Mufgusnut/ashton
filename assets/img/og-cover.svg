<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0620"/>
      <stop offset="55%" stop-color="#200b3d"/>
      <stop offset="100%" stop-color="#190a2e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="45%" stop-color="#ff2e9e"/>
      <stop offset="75%" stop-color="#ff8906"/>
      <stop offset="100%" stop-color="#ffe53b"/>
