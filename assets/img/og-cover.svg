    <linearGradient id="text-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe53b"/>
      <stop offset="100%" stop-color="#ff2e9e"/>
    </linearGradient>
    <clipPath id="sunClip"><circle cx="600" cy="230" r="230"/></clipPath>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g clip-path="url(#sunClip)">
